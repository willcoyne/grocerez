# GrocerEZ on one Akamai Cloud (Linode) instance: Postgres + API (incl. the Akamai AI agent) + web app,
# behind Caddy with automatic HTTPS. deploy.sh copies the repo to /opt/grocerez and runs:
#   docker compose -f deploy/linode/compose.yml --env-file deploy/linode/.env up -d --build
# deploy/linode/.env (git-ignored, written by deploy.sh) holds SITE_HOST, POSTGRES_PASSWORD, JWT_SECRET, DEMO_KEY,
# AGENT_SHARED_SECRET.
# API secrets (AKAMAI_*, S3_* / AWS_*, GOOGLE_CLIENT_IDS, ...) come from server/.env.prod.
name: grocerez

services:
  db:
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: grocerez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/linode/.env}
      POSTGRES_DB: grocerez
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocerez -d grocerez"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ../../server
    restart: unless-stopped
    env_file:
      - path: ../../server/.env.prod
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://grocerez:${POSTGRES_PASSWORD}@db:5432/grocerez
      JWT_SECRET: ${JWT_SECRET:?set in deploy/linode/.env}
      # Demo sign-in for judges (POST /api/dev/login-as needs header x-demo-key).
      DEMO_KEY: ${DEMO_KEY:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-not-configured.apps.googleusercontent.com}
      APP_LINK_BASE: grocerez://
      CORS_ORIGINS: https://${SITE_HOST}
      ENABLE_JOBS: "true"
      AGENT_URL: http://agent:8000
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set in deploy/linode/.env}
      AGENT_PUBLIC_API_URL: http://api:3000/api
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed && node dist/src/index.js"]

  # Pantry Agent ("Plan our week"): internal only, the API reaches it at http://agent:8000.
  # deploy/linode/.env.agent (git-ignored, written by deploy.sh) holds AKAMAI_INFERENCE_KEY.
  agent:
    build: ../../agent
    restart: unless-stopped
    env_file:
      - path: ./.env.agent
        required: false
    environment:
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set in deploy/linode/.env}

  web:
    build:
      context: ../..
      dockerfile: app/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://${SITE_HOST}/api
        EXPO_PUBLIC_DEMO_KEY: ${DEMO_KEY:-}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?set in deploy/linode/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddydata:
